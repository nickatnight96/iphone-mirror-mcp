name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check [limitations.md](../../blob/main/docs/limitations.md)
        first — some things (pinch, hardware buttons, Face ID) were attempted
        and are genuinely not possible from a user process, and that document
        explains why.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the implementation — there may be an existing way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Which existing tools you used and how they fell short.
